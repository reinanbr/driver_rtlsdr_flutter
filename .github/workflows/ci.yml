name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 - static analysis + pure Dart unit/widget tests (host).
  # No Android build involved, so this is fast and runs on every push/PR
  # before we spend time on the emulator matrix below.
  # ---------------------------------------------------------------------------
  analyze-and-unit:
    name: analyze + unit (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install plugin dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze plugin
        run: flutter analyze --fatal-infos

      - name: Run plugin unit tests
        run: flutter test # test/: DemodMode, UsbState, FFI struct layout

      - name: Install example app dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example app
        working-directory: example
        run: flutter analyze --fatal-infos

      - name: Run example app widget tests
        working-directory: example
        run: flutter test

  # ---------------------------------------------------------------------------
  # Job 2 - integration test on an emulator.
  #
  # Runs on ubuntu-latest with a KVM-accelerated x86_64 emulator, NOT
  # arm64-v8a on macos-14 as originally attempted. GitHub-hosted macos-14
  # (and macos-26) runners run on M1 hardware, which does not support
  # nested virtualization — the Android emulator's arm64-v8a image can
  # never boot with hardware acceleration there, only time out (confirmed
  # against ReactiveCircus/android-emulator-runner#350, #392 and the linked
  # actions/runner-images discussion; this isn't flakiness, it's a hard
  # hardware limitation of the M1-based runner fleet as of mid-2026).
  # GitHub's Linux arm64 runners don't expose /dev/kvm either, so a real
  # accelerated arm64-v8a emulator isn't available on any free GitHub-hosted
  # runner today.
  #
  # x86_64 on ubuntu-latest is the combination that's actually reliable:
  # KVM-accelerated, and the plugin's native sources (vendored libusb/
  # librtlsdr + Oboe) are portable C/C++ with no ARM-specific code, so they
  # build fine for x86_64 too. That ABI is opt-in only for the plugin
  # (driverRtlsdrCiAbis project property, set via env below) — release
  # consumers still only get arm64-v8a/armeabi-v7a, since those are the
  # only ABIs real Android/RTL-SDR devices use.
  #
  # Matrix is deliberately a spread of meaningful Android versions rather
  # than every API level:
  #   26 - floor (minSdk required by Oboe/AAudio's low-latency path)
  #   29 - Android 10, scoped storage / background limits baseline
  #   33 - Android 13, runtime permission model most devices run today
  #   36 - latest stable (Android 16), also picks up 16 KB page size in the .so
  #
  # This validates that libnative_rtlsdr.so builds, links and LOADS across
  # that spread, and that a real FFI round-trip works — see
  # example/integration_test/plugin_integration_test.dart. No physical
  # RTL-SDR dongle is involved or needed, and no ARM-specific code path
  # exists that this ABI substitution could hide.
  # ---------------------------------------------------------------------------
  integration:
    name: integration (API ${{ matrix.api-level }}, x86_64)
    needs: analyze-and-unit
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_driverRtlsdrCiAbis: "true"
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 33, 36]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'example/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Android NDK & CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - name: Install example app dependencies
        working-directory: example
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Integration test on x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            cd example
            flutter test integration_test
