name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # `flutter pub get` above also auto-resolves example/ (Flutter
      # special-cases a plugin's own "example" dir) but not rtlsdr_mobile/
      # — without this, `flutter analyze` below finds rtlsdr_mobile/*.dart
      # with no resolved package config and fails on every provider/
      # share_plus import.
      - working-directory: rtlsdr_mobile
        run: flutter pub get

      - run: flutter analyze
      - run: flutter test

      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: flutter test

      - working-directory: rtlsdr_mobile
        run: flutter test

  build-and-release:
    name: Build & publish zipped release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android NDK & CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - run: flutter pub get

      - name: Install example app dependencies
        working-directory: example
        run: flutter pub get

      - name: Install rtlsdr_mobile app dependencies
        working-directory: rtlsdr_mobile
        run: flutter pub get

      - name: Build example release APK (arm64-v8a + armeabi-v7a)
        working-directory: example
        run: flutter build apk --release

      - name: Build rtlsdr_mobile release APK (arm64-v8a + armeabi-v7a)
        working-directory: rtlsdr_mobile
        run: flutter build apk --release

      - name: Package zipped build
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE_DIR="dist/driver_rtlsdr-${VERSION}-android"
          mkdir -p "$STAGE_DIR"
          cp example/build/app/outputs/flutter-apk/app-release.apk \
            "$STAGE_DIR/driver_rtlsdr-example-${VERSION}.apk"
          cp README.md CHANGELOG.md LICENSE "$STAGE_DIR/"
          ZIP_PATH="dist/driver_rtlsdr-${VERSION}-android.zip"
          (cd dist && zip -r "$(basename "$ZIP_PATH")" "$(basename "$STAGE_DIR")")

          # rtlsdr_mobile's APK is also published standalone (not just inside
          # the zip above) so it can be installed straight from the release
          # page with a single tap/download, no unzip step needed.
          APK_PATH="dist/rtlsdr_mobile-${VERSION}-android.apk"
          cp rtlsdr_mobile/build/app/outputs/flutter-apk/app-release.apk "$APK_PATH"

          # Fixed-name copy + JSON manifest so an external site (e.g. our
          # landing page) can always resolve the newest build without
          # tracking version numbers itself. GitHub redirects
          # .../releases/latest/download/<name> to whatever release is
          # currently marked "Latest" — as long as every release uploads an
          # asset with that exact fixed name, these two URLs never change:
          #   https://github.com/<repo>/releases/latest/download/rtlsdr_mobile-latest.apk
          #   https://github.com/<repo>/releases/latest/download/latest.json
          LATEST_APK_PATH="dist/rtlsdr_mobile-latest.apk"
          cp rtlsdr_mobile/build/app/outputs/flutter-apk/app-release.apk "$LATEST_APK_PATH"

          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          MANIFEST_PATH="dist/latest.json"
          cat > "$MANIFEST_PATH" <<EOF
          {
            "version": "$VERSION",
            "tag": "$GITHUB_REF_NAME",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "apk_url": "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/rtlsdr_mobile-${VERSION}-android.apk",
            "apk_latest_url": "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/rtlsdr_mobile-latest.apk",
            "zip_url": "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/driver_rtlsdr-${VERSION}-android.zip",
            "sha256": "$APK_SHA256"
          }
          EOF

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "latest_apk_path=$LATEST_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: driver_rtlsdr ${{ steps.package.outputs.version }}
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.latest_apk_path }}
            ${{ steps.package.outputs.manifest_path }}
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Publish to pub.dev once tests and the example app build have both passed.
  #
  # Uses pub.dev's "Automated publishing" (GitHub Actions OIDC) — no secrets
  # stored in this repo. This only works once, on pub.dev, you:
  #   1. Have published this package manually at least once (claims the name
  #      under your account — `flutter pub publish` from a local machine).
  #   2. On the package's pub.dev page -> Admin tab -> Automated publishing,
  #      enable GitHub Actions publishing for repository
  #      "reinanbr/driver_rtlsdr_flutter", workflow file "release.yml", and
  #      (recommended) require the tag pattern "v{{version}}".
  # Until that's configured, this job will fail at the `pub publish` step
  # with an authentication error — the rest of the release is unaffected.
  # ---------------------------------------------------------------------------
  publish-pub-dev:
    name: Publish to pub.dev
    needs: build-and-release
    if: github.repository == 'reinanbr/driver_rtlsdr_flutter'
    runs-on: ubuntu-latest
    # Without OIDC trusted publishing configured on pub.dev (see the comment
    # above), `flutter pub publish` falls back to its interactive browser
    # OAuth flow and hangs indefinitely in headless CI instead of failing
    # fast — this bounds that failure mode to a few minutes instead of
    # silently burning hours of runner time (observed: v0.0.2's run sat
    # "in_progress" for 2+ hours before being cancelled by hand).
    timeout-minutes: 5
    permissions:
      id-token: write # required for pub.dev's OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      # This is the step that actually creates/writes the OIDC credentials
      # `flutter pub publish` needs — without it, there's nothing for pub
      # publish to authenticate with, so it silently falls back to its
      # interactive browser OAuth flow (which is the timeout above catches,
      # but the real fix is this step). Confirmed via the v0.1.1 run's raw
      # log: "Pub needs your authorization... In a web browser, go to
      # https://accounts.google.com/o/oauth2/auth..." — that's the
      # tell-tale sign this step is missing, not a pub.dev-side
      # misconfiguration. See https://dart.dev/tools/pub/automated-publishing.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify pubspec.yaml version matches the pushed tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pubspec.yaml version $PUBSPEC_VERSION - bump pubspec.yaml before tagging."
            exit 1
          fi

      - run: flutter pub get

      - name: Publish to pub.dev
        run: flutter pub publish --force
