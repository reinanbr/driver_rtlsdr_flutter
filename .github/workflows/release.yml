name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: flutter test

  build-and-release:
    name: Build & publish zipped release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android NDK & CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - run: flutter pub get

      - name: Install example app dependencies
        working-directory: example
        run: flutter pub get

      - name: Build release APK (arm64-v8a + armeabi-v7a)
        working-directory: example
        run: flutter build apk --release

      - name: Package zipped build
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE_DIR="dist/driver_rtlsdr-${VERSION}-android"
          mkdir -p "$STAGE_DIR"
          cp example/build/app/outputs/flutter-apk/app-release.apk \
            "$STAGE_DIR/driver_rtlsdr-example-${VERSION}.apk"
          cp README.md CHANGELOG.md LICENSE "$STAGE_DIR/"
          ZIP_PATH="dist/driver_rtlsdr-${VERSION}-android.zip"
          (cd dist && zip -r "$(basename "$ZIP_PATH")" "$(basename "$STAGE_DIR")")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: driver_rtlsdr ${{ steps.package.outputs.version }}
          files: ${{ steps.package.outputs.zip_path }}
          generate_release_notes: true
